<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clayton Malone - CV</title>
  <style>
    :root { --bg:#0b0d10; --panel:#12161b; --text:#e8ecf1; --muted:#b7c0cc; --accent:#6aa9ff; }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;background:#0d1117;border-bottom:1px solid #1f2a36}
    .wrap{max-width:950px;margin:0 auto;padding:16px}
    nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    .tablink{padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--text);border:1px solid transparent}
    .tablink.active{border-color:#1f2a36;background:var(--panel)}
    main{max-width:950px;margin:0 auto;padding:20px}
    .card{background:var(--panel);border:1px solid #1f2a36;border-radius:14px;padding:20px}
    .tab{display:none} .tab.active{display:block}
    h1{margin:0 0 6px;font-size:28px}
    h2{margin:0 0 12px;font-size:22px}
    p.muted{color:var(--muted);margin:0}
    @media (max-width:720px){ nav{gap:8px} }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Clayton Malone</h1>
      <p class="muted">Email • Phone • Links</p>
      <nav aria-label="Sections" role="tablist">
        <a href="#about"    class="tablink" id="tab-about"    role="tab" aria-controls="about"    aria-selected="true">About Me</a>
        <a href="#research" class="tablink" id="tab-research" role="tab" aria-controls="research" aria-selected="false">Research</a>
        <a href="#teaching" class="tablink" id="tab-teaching" role="tab" aria-controls="teaching" aria-selected="false">Teaching</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="about" class="card tab active" role="tabpanel" aria-labelledby="tab-about">
      <h2>About Me</h2>
      <!-- Add content here -->
    </section>

    <section id="research" class="card tab" role="tabpanel" aria-labelledby="tab-research">
      <h2>Research</h2>
      <!-- Add content here -->
    </section>

    <section id="teaching" class="card tab" role="tabpanel" aria-labelledby="tab-teaching">
      <h2>Teaching</h2>
      <!-- Add content here -->
    </section>
  </main>

  <script>
    (function () {
      const links = Array.from(document.querySelectorAll('.tablink'));
      const tabs  = Array.from(document.querySelectorAll('.tab'));

      function activate(id) {
        const target = id?.replace('#','') || 'about';
        tabs.forEach(s => s.classList.toggle('active', s.id === target));
        links.forEach(a => {
          const on = a.getAttribute('href') === '#' + target;
          a.classList.toggle('active', on);
          a.setAttribute('aria-selected', String(on));
          a.tabIndex = on ? 0 : -1;
        });
      }

      links.forEach(a => a.addEventListener('click', (e) => {
        e.preventDefault();
        const href = a.getAttribute('href');
        history.pushState(null, '', href);
        activate(href);
      }));

      window.addEventListener('hashchange', () => activate(location.hash));
      activate(location.hash);
    })();
  </script>
</body>
</html>
